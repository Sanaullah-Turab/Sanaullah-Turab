name: Generate Snake and Streak

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak card
        run: python3 scripts/streak.py dist/streak.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#F28C28&color_dots=#161b22,#4a2a0f,#8a4a14,#c8681c,#F28C28&color_dot_border=#0d1117
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#F28C28&color_dots=#ebedf0,#fde3c4,#fbbf77,#f59e3f,#F28C28

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}